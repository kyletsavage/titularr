# Titularr config. Copy this file to config.yaml and edit it.
# ${NAME} is replaced with the environment variable NAME, so secrets stay out of the file.

sources:
  tmdb:
    token: ${TMDB_API_TOKEN}   # your TMDB "API Read Access Token"

# Your Radarr / Sonarr, so previews can skip titles you already have ("in library"),
# and --apply can add movies and series. API key: Settings > General > Security in each app.
# Uncomment the apps you use. A section that's present but can't be used (e.g. its
# API key variable isn't set) gives a warning, and that library check is skipped.
# radarr:
#   url: http://radarr:7878
#   api_key: ${RADARR_API_KEY}
#   # How --apply adds movies. The first two are needed only to add:
#   quality_profile: HD-1080p          # a profile name, as Radarr shows it
#   root_folder: /movies               # one of Radarr's root folders
#   # monitored: true                  # default: true
#   # minimum_availability: released   # announced, inCinemas or released (default)
#   # search_on_add: false             # default: false; review what was added first
#   # tags: [english]                  # existing Radarr tags (see below); default: none
# sonarr:
#   url: http://sonarr:8989
#   api_key: ${SONARR_API_KEY}
#   # How --apply adds series. The first two are needed only to add:
#   quality_profile: HD-1080p          # a profile name, as Sonarr shows it
#   root_folder: /tv                   # one of Sonarr's root folders
#   # monitor: all                     # which episodes: all (default), future, missing,
#   #                                  # existing, firstSeason, lastSeason, pilot, recent,
#   #                                  # monitorSpecials, unmonitorSpecials or none
#   # season_folder: true              # default: true
#   # series_type: standard            # standard (default), daily or anime
#   # monitor_new_items: all           # new seasons: all (default) or none
#   # search_on_add: false             # default: false; review what was added first
#   # tags: [english]                  # existing Sonarr tags (see below); default: none
#
# Tags decide which release profiles (required/ignored words), indexers and download
# clients apply to a title, so they must already exist in the app: a missing one is an
# error, never created. A query's own tags replace these ones.

# Never keep these titles, in any query. Checked alongside each query's own exclusions;
# excluded titles say which list excluded them ("global:" or "query:").
exclusions:
  ids: [movie:1399]            # movie:<tmdb id> or series:<tmdb id>
  titles: [sing-along]         # titles containing this text (ignoring case and accents)
  # regexes: ['^the ']         # titles matching this regular expression

# Saved queries, by name. Run one with: titularr run holiday-movies
queries:
  holiday-movies:
    text: christmas            # what TMDB searches for, and what titles must contain
    kinds: [movie]             # movie and/or series (default: both)
    match: word                # substring (default), word, or regex (needs pattern:)
    filters:
      year_min: 1940
      min_votes: 500
      # languages: [en]        # default: English only; "any" for every language

  dracula:
    text: dracula              # titles containing "dracula"...
    kinds: [movie]
    # match: regex             # ...or only exact "Dracula" / "Dracula 2000"-style titles:
    # pattern: '^dracula( \d+)?$'
    filters:
      languages: any
    exclusions:                # this query's own, checked after the global list
      titles: [dead and loving]  # ...except the 1995 parody "Dracula: Dead and Loving It"
    # radarr:                  # this query's own add settings, replacing the radarr section's
    #   root_folder: /horror

  # gundam:
  #   text: gundam
  #   kinds: [series]
  #   filters:
  #     languages: [ja]
  #   sonarr:                  # this query's own add settings, replacing the sonarr section's
  #     series_type: anime
  #     root_folder: /anime
  #     tags: [anime]          # replaces the sonarr section's tags for this query
