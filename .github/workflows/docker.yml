name: Docker image

# Pull requests: build the image and check it starts. Pushes to main: build it and
# publish it to ghcr.io/kyletsavage/titularr as `latest` and `sha-<commit>`.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write # only used to push, on main

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
          # GitHub reports the license as GPL-3.0; pyproject says "or later".
          labels: |
            org.opencontainers.image.licenses=GPL-3.0-or-later

      - name: Build (and push, on main)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check the image runs
        if: github.event_name == 'pull_request'
        run: docker run --rm "${{ fromJSON(steps.meta.outputs.json).tags[0] }}" --help
